[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank_etl"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "sqlalchemy>=2.0",
    "psycopg2-binary",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]